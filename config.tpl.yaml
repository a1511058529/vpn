# mihomo 配置模板 —— 由 mihomo.sh 安装时填充占位符，请勿手工改占位符
# 占位符: __SUB_URL__ __SECRET__ __ALLOW_LAN__ __TUN_ENABLE__ __CTRL_LISTEN__

mixed-port: 7890
allow-lan: __ALLOW_LAN__
bind-address: "*"
mode: rule
log-level: info
ipv6: true
unified-delay: true
tcp-concurrent: true
find-process-mode: off

external-controller: __CTRL_LISTEN__
secret: "__SECRET__"
external-ui: ui

profile:
  store-selected: true
  store-fake-ip: true

# TUN 透明代理：默认关闭。软路由/网关场景在脚本菜单里打开
tun:
  enable: __TUN_ENABLE__
  stack: mixed
  device: utun0
  auto-route: true
  auto-detect-interface: true
  strict-route: false
  dns-hijack:
    - any:53
    - tcp://any:53
  mtu: 9000

sniffer:
  enable: true
  override-destination: true
  force-dns-mapping: true
  parse-pure-ip: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
      override-destination: true
    QUIC:
      ports: [443, 8443]
      override-destination: true

dns:
  enable: true
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  # 不能写 "*"：它会让所有域名都在本机用国内 DNS 解析，造成 DNS 泄漏。
  # 境外域名拿 fake-ip，真正的解析交给节点服务器去做。
  fake-ip-filter:
    - "+.lan"
    - "+.local"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "localhost.ptlogin2.qq.com"
  use-hosts: true
  # 只用来解析下面 DoH 服务器的域名和节点域名，必须是 IP
  default-nameserver: ['223.5.5.5', '119.29.29.29']
  proxy-server-nameserver: ['223.5.5.5', '119.29.29.29']
  # 需要本机解析时走境外 DoH，且这些查询本身经由「🔰 选择节点」发出，国内 DNS 看不到
  nameserver:
    - 'https://1.1.1.1/dns-query#🔰 选择节点'
    - 'https://8.8.8.8/dns-query#🔰 选择节点'
  # 国内域名和内网域名仍用国内 DNS，保证解析到最近的 CDN
  nameserver-policy:
    'geosite:cn,private':
      - 'https://223.5.5.5/dns-query'
      - 'https://120.53.53.53/dns-query'

######### 锚点 start #######
p: &p {interval: 3600, health-check: {enable: true, url: https://www.gstatic.com/generate_204, interval: 300}}
u: &u {use: ['Sub']}
######### 锚点 end #######

proxy-providers:
  Sub:
    <<: *p
    type: http
    path: ./providers/sub.yaml
    url: "__SUB_URL__"

proxies:

proxy-groups:
- {name: ♻️ 自动选择, type: url-test, url: http://www.gstatic.com/generate_204, interval: 300, tolerance: 50, proxies: [], <<: *u}
- {name: 🔰 选择节点, type: select, proxies: ['♻️ 自动选择', DIRECT], <<: *u}
- {name: 🤖 AI, type: select, proxies: ['🔰 选择节点', '♻️ 自动选择'], <<: *u}
- {name: 🌏 爱奇艺&哔哩哔哩, type: select, proxies: [DIRECT, '🔰 选择节点']}
- {name: 📺 动画疯, type: select, proxies: ['🔰 选择节点', DIRECT]}
- {name: 🎮 Steam 登录/下载, type: select, proxies: [DIRECT, '🔰 选择节点']}
- {name: 🎮 Steam 商店/社区, type: select, proxies: ['🔰 选择节点', DIRECT]}
- {name: 🌩️ Cloudflare, type: select, proxies: ['🔰 选择节点', DIRECT]}
- {name: ☁️ OneDrive, type: select, proxies: ['🔰 选择节点', DIRECT]}
- {name: 🎓学术网站, type: select, proxies: [DIRECT, '🔰 选择节点']}
- {name: 🇨🇳 国内网站, type: select, proxies: [DIRECT, '🔰 选择节点']}
- {name: 🐟 漏网之鱼, type: select, proxies: ['🔰 选择节点', DIRECT]}

